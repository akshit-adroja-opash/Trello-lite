<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trello-lite</title>
    <script>
      (function() {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary:          '#4F46E5',
              'primary-dark':   '#3730A3',
              'primary-light':  '#818CF8',
              'primary-bg':     '#EEF2FF',
              'on-primary':     '#FFFFFF',

              background:             '#F8FAFC',
              'on-background':        '#0F172A',
              surface:                '#FFFFFF',
              'surface-raised':       '#F1F5F9',
              'surface-overlay':      '#E2E8F0',
              'surface-container':    '#F1F5F9',
              'surface-container-low':'#F8FAFC',
              'surface-variant':      '#E2E8F0',

              'on-surface':         '#0F172A',
              'on-surface-variant': '#475569',
              'text-muted':         '#94A3B8',

              'outline':         '#CBD5E1',
              'outline-variant': '#E2E8F0',

              success:          '#10B981',
              'on-success':     '#FFFFFF',
              warning:          '#F59E0B',
              'on-warning':     '#FFFFFF',
              error:            '#EF4444',
              'on-error':       '#FFFFFF',
              'error-container':'#FEF2F2',
              'on-error-container': '#991B1B',

              secondary:           '#0EA5E9',
              'on-secondary':      '#FFFFFF',
              'secondary-container':'#E0F2FE',
              'on-secondary-container': '#0369A1',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            fontSize: {
              'display':     ['48px', { lineHeight: '56px', fontWeight: '700' }],
              'headline-lg': ['32px', { lineHeight: '40px', fontWeight: '600' }],
              'headline-md': ['24px', { lineHeight: '32px', fontWeight: '600' }],
              'headline-sm': ['20px', { lineHeight: '28px', fontWeight: '600' }],
              'body-lg':     ['18px', { lineHeight: '28px', fontWeight: '400' }],
              'body-md':     ['16px', { lineHeight: '24px', fontWeight: '400' }],
              'body-sm':     ['14px', { lineHeight: '20px', fontWeight: '400' }],
              'label-md':    ['14px', { lineHeight: '20px', fontWeight: '500' }],
              'label-sm':    ['12px', { lineHeight: '16px', fontWeight: '600' }],
            },
            borderRadius: {
              DEFAULT: '0.375rem',
              lg:  '0.5rem',
              xl:  '0.75rem',
              '2xl': '1rem',
              '3xl': '1.5rem',
              full: '9999px',
            },
            boxShadow: {
              sm: '0 1px 3px rgba(15,23,42,0.08), 0 1px 2px rgba(15,23,42,0.04)',
              DEFAULT: '0 4px 12px rgba(15,23,42,0.10), 0 2px 4px rgba(15,23,42,0.06)',
              lg: '0 20px 40px rgba(15,23,42,0.12), 0 8px 16px rgba(15,23,42,0.06)',
            },
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="bg-background text-on-background min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
