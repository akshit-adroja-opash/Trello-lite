<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trello-lite</title>
    <script>
      (function() {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              "surface-bright": "var(--surface)",
              "secondary-fixed": "#e9ddff",
              "primary-fixed-dim": "#c0c1ff",
              "on-error": "#ffffff",
              "on-tertiary-container": "#e7f3ff",
              "surface-container": "var(--surface-raised)",
              "surface-container-highest": "#d3e4fe",
              "surface": "var(--surface)",
              "on-background": "var(--text-primary)",
              "on-surface": "var(--text-primary)",
              "surface-container-low": "var(--surface-raised)",
              "error-container": "#ffdad6",
              "secondary-container": "#8455ef",
              "surface-tint": "#4a4dcf",
              "primary-fixed": "#e1e0ff",
              "on-primary": "#ffffff",
              "on-secondary-fixed": "#23005c",
              "secondary-fixed-dim": "#d0bcff",
              "inverse-on-surface": "#eaf1ff",
              "outline": "var(--border)",
              "on-tertiary-fixed-variant": "#004c6e",
              "surface-container-lowest": "var(--surface)",
              "on-tertiary-fixed": "#001e2f",
              "background": "var(--bg)",
              "surface-container-high": "#dce9ff",
              "on-tertiary": "#ffffff",
              "on-secondary-fixed-variant": "#5516be",
              "tertiary-fixed-dim": "#89ceff",
              "surface-variant": "#d3e4fe",
              "on-primary-container": "#f3f0ff",
              "surface-dim": "#cbdbf5",
              "error": "#ba1a1a",
              "tertiary-container": "#0075a7",
              "on-primary-fixed-variant": "#3031b7",
              "tertiary-fixed": "#c9e6ff",
              "on-secondary-container": "#fffbff",
              "secondary": "#6b38d4",
              "primary": "var(--primary)",
              "inverse-surface": "#213145",
              "on-error-container": "#93000a",
              "on-surface-variant": "var(--text-secondary)",
              "on-secondary": "#ffffff",
              "outline-variant": "var(--border)",
              "tertiary": "#005b84",
              "inverse-primary": "#c0c1ff",
              "primary-container": "#5a5ee0",
              "on-primary-fixed": "#05006c",
              'primary-dark':   'var(--primary-dark)',
              'primary-light':  'var(--primary-light)',
              'primary-bg':     'var(--primary-bg)',
              'surface-raised':       'var(--surface-raised)',
              'surface-overlay':      'var(--surface-overlay)',
            },
            spacing: {
              'sidebar-width': '280px',
            },
            fontFamily: {
              sans: ['Hanken Grotesk', 'system-ui', 'sans-serif'],
            },
            fontSize: {
              'display':     ['48px', { lineHeight: '56px', fontWeight: '700' }],
              'headline-lg': ['32px', { lineHeight: '40px', fontWeight: '600' }],
              'headline-md': ['24px', { lineHeight: '32px', fontWeight: '600' }],
              'headline-sm': ['20px', { lineHeight: '28px', fontWeight: '600' }],
              'body-lg':     ['18px', { lineHeight: '28px', fontWeight: '400' }],
              'body-md':     ['16px', { lineHeight: '24px', fontWeight: '400' }],
              'body-sm':     ['14px', { lineHeight: '20px', fontWeight: '400' }],
              'label-md':    ['14px', { lineHeight: '20px', fontWeight: '500' }],
              'label-sm':    ['12px', { lineHeight: '16px', fontWeight: '600' }],
            },
            borderRadius: {
              DEFAULT: '0.375rem',
              lg:  '0.5rem',
              xl:  '0.75rem',
              '2xl': '1rem',
              '3xl': '1.5rem',
              full: '9999px',
            },
            boxShadow: {
              sm: '0 1px 3px rgba(15,23,42,0.08), 0 1px 2px rgba(15,23,42,0.04)',
              DEFAULT: '0 4px 12px rgba(15,23,42,0.10), 0 2px 4px rgba(15,23,42,0.06)',
              lg: '0 20px 40px rgba(15,23,42,0.12), 0 8px 16px rgba(15,23,42,0.06)',
            },
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="bg-background text-on-background min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
